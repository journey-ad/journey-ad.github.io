<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,8 89,30 89,72 50,94 11,72 11,30' fill='none' stroke='%23888' stroke-width='8' stroke-linejoin='round'/></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a demo site.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500&display=swap" rel="stylesheet">
<style>
  .link-underline {
    position: relative;
  }
  .link-underline::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 1px;
    background: currentColor;
    transform: scaleX(0);
    transform-origin: right;
    transition: transform 0.3s ease;
  }
  .link-underline:hover::after {
    transform: scaleX(1);
    transform-origin: left;
  }
</style>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        paper: '#fafaf8',
        ink: '#1a1a1a',
        'ink-dim': '#6b6b6b',
        'ink-fade': '#b0b0a8',
        rule: '#e5e3dc',
      },
      fontFamily: {
        display: ['Syne', 'Helvetica Neue', 'Arial', 'sans-serif'],
        body: ['Newsreader', 'Georgia', 'Times New Roman', 'serif'],
      },
      animation: {
        'row-in': 'rowIn 0.45s both',
      },
      keyframes: {
        rowIn: {
          '0%': { opacity: '0', transform: 'translateY(6px)' },
          '100%': { opacity: '1', transform: 'translateY(0)' },
        }
      }
    }
  }
}
</script>
</head>
<body class="bg-paper text-ink font-body min-h-screen flex justify-center">
<div id="app" class="w-full">
  <main class="w-4/5 max-w-[1280px] mx-auto pt-[10vh] pb-[6vh] px-[6vw] flex flex-col gap-20 max-sm:pt-[8vh] max-sm:pb-[5vh] max-sm:px-[5vw] max-sm:gap-12">

    <!-- Header -->
    <header class="flex justify-between items-end pb-8 border-b border-rule max-sm:flex-col max-sm:items-start max-sm:gap-[0.35rem]">
      <h1 class="font-display font-semibold text-[clamp(1.3rem,2.2vw,1.6rem)] tracking-[-0.01em] text-ink">
        {{ t('h1Main') }} <em class="not-italic text-ink-dim font-normal">{{ t('h1Sub') }}</em>
      </h1>
      <div class="flex items-center gap-4 max-sm:self-end">
        <span class="font-display text-[0.7rem] font-medium tracking-[0.08em] uppercase text-ink-dim">
          {{ countText }}
        </span>
        <div class="flex items-center gap-2 font-display text-[0.7rem] font-medium tracking-[0.08em]">
          <button @click="toggleLang" class="appearance-none cursor-pointer text-ink-dim transition-colors duration-200 hover:text-ink">{{ lang === 'en' ? '[中文]' : '[En]' }}</button>
        </div>
      </div>
    </header>

    <!-- Note -->
    <p class="text-[1.3rem] leading-[1.6] text-ink-dim max-w-[36rem] max-sm:text-[1.15rem]">
      {{ t('intro') }}
    </p>

    <!-- Catalog -->
    <section id="catalog" class="flex flex-col scroll-mt-[6vh]">
      <div class="grid grid-cols-[1fr_2fr] gap-8 pb-[0.85rem] border-b border-rule max-sm:grid-cols-1 max-sm:gap-1">
        <span class="font-display text-[0.65rem] font-medium tracking-[0.1em] uppercase text-ink-dim">{{ t('colProject') }}</span>
        <span class="font-display text-[0.65rem] font-medium tracking-[0.1em] uppercase text-ink-dim">{{ t('colDescription') }}</span>
      </div>

      <!-- Loading -->
      <div v-if="loading" class="py-8 text-[0.95rem] text-ink-fade italic">{{ t('loading') }}</div>

      <!-- Error -->
      <div v-else-if="error" class="py-8 text-[0.95rem] text-[#b66]">{{ t('error') }}</div>

      <!-- Empty -->
      <div v-else-if="!repos.length" class="py-8 text-[0.95rem] text-ink-fade italic">{{ t('empty') }}</div>

      <!-- Rows -->
      <div v-for="(r, i) in repos" :key="r.id"
           class="grid grid-cols-[1fr_2fr] gap-8 py-[1.05rem] border-b border-dotted border-rule animate-row-in max-sm:grid-cols-1 max-sm:gap-1"
           :style="{ animationDelay: (0.03 + i * 0.04) + 's' }">
        <span class="font-medium text-[1.05rem]">
          <a :href="repoPreviewUrl(r)" target="_blank" class="text-ink no-underline link-underline hover:text-[#999]">{{ r.name }}</a>
        </span>
        <div>
          <div class="text-[0.95rem] leading-[1.55] text-ink-dim">{{ truncateDesc(r.description) }}</div>
          <div v-if="metaParts(r).length" class="flex flex-wrap items-center gap-x-4 gap-y-2 mt-[0.55rem] font-display text-[0.65rem] font-medium tracking-[0.04em] uppercase text-ink-fade">
            <template v-for="(p, pi) in metaParts(r)" :key="pi">
              <!-- language -->
              <span v-if="p.t === 'lang'" class="inline-flex items-center gap-[0.3em] whitespace-nowrap">
                <span class="inline-block w-[7px] h-[7px] rounded-full flex-shrink-0" :style="{ background: p.color }"></span>{{ p.name }}
              </span>
              <!-- stars -->
              <span v-else-if="p.t === 'stars'" class="inline-flex items-center gap-[0.3em] whitespace-nowrap">★ {{ p.count }}</span>
              <!-- topic tag -->
              <span v-else-if="p.t === 'tag'" class="inline-block px-[0.55em] py-[0.15em] border border-rule rounded-[2px] text-[0.6rem] tracking-[0.06em] text-ink-dim">{{ p.name }}</span>
              <!-- time -->
              <span v-else-if="p.t === 'time'" class="inline-flex items-center gap-[0.3em] whitespace-nowrap" :title="p.title">{{ p.display }}</span>
              <!-- source -->
              <a v-else-if="p.t === 'source'" class="inline-flex items-center gap-[0.3em] whitespace-nowrap text-ink-dim no-underline transition-colors duration-200 hover:text-ink" :href="p.url" target="_blank">{{ p.label }} ↗</a>
            </template>
          </div>
        </div>
      </div>
    </section>

    <!-- Pagination -->
      <div v-if="!loading && !error && repos.length" class="flex justify-center items-center gap-6">
        <button @click="goPage(page - 1)" :disabled="page <= 1" class="font-display text-[0.68rem] font-medium tracking-[0.08em] uppercase border border-rule rounded-[2px] px-4 py-[0.45rem] text-ink-dim transition-colors duration-200 hover:text-ink hover:border-ink-fade disabled:opacity-30 disabled:cursor-default disabled:hover:text-ink-dim disabled:hover:border-rule">{{ t('prev') }}</button>
        <span class="font-display text-[0.68rem] font-medium tracking-[0.08em] uppercase text-ink-dim">{{ pageText }}</span>
        <button @click="goPage(page + 1)" :disabled="page >= totalPages" class="font-display text-[0.68rem] font-medium tracking-[0.08em] uppercase border border-rule rounded-[2px] px-4 py-[0.45rem] text-ink-dim transition-colors duration-200 hover:text-ink hover:border-ink-fade disabled:opacity-30 disabled:cursor-default disabled:hover:text-ink-dim disabled:hover:border-rule">{{ t('next') }}</button>
      </div>

    <!-- Footer -->
    <footer class="flex justify-between items-baseline pt-6 border-t border-rule max-sm:flex-col max-sm:gap-3">
      <div class="flex gap-8 max-sm:gap-6">
        <a href="/" class="font-display text-[0.68rem] font-medium tracking-[0.08em] uppercase text-ink-dim no-underline transition-colors duration-200 hover:text-ink">{{ t('navIndex') }}</a>
        <a href="https://gh.ovo.re/star-list/" target="_blank" class="font-display text-[0.68rem] font-medium tracking-[0.08em] uppercase text-ink-dim no-underline transition-colors duration-200 hover:text-ink">{{ t('navStars') }}</a>
        <template v-if="CONFIG.email">
          <a :href="'mailto:' + CONFIG.email" class="font-display text-[0.68rem] font-medium tracking-[0.08em] uppercase text-ink-dim no-underline transition-colors duration-200 hover:text-ink">{{ t('navLetter') }}</a>
        </template>
        <template v-if="CONFIG.source">
          <a :href="CONFIG.source" target="_blank" class="font-display text-[0.68rem] font-medium tracking-[0.08em] uppercase text-ink-dim no-underline transition-colors duration-200 hover:text-ink">{{ t('navSource') }}</a>
        </template>
      </div>
      <span class="text-[0.8rem] text-ink-fade italic normal-case tracking-normal">{{ t('tagline') }}</span>
    </footer>

  </main>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
(function () {
  var LANG_COLORS = {
    JavaScript:'#f1e05a', TypeScript:'#3178c6', Python:'#3572A5', Go:'#00ADD8',
    Rust:'#dea584', Java:'#b07219', Ruby:'#701516', C:'#555555', 'C++':'#f34b7d',
    'C#':'#178600', PHP:'#4F5D95', Swift:'#F05138', Kotlin:'#A97BFF',
    Dart:'#00B4AB', Elixir:'#6e4a7e', Clojure:'#db5855', Haskell:'#5e5086',
    Lua:'#000080', Zig:'#ec915c', Shell:'#89e051', HTML:'#e34c26', CSS:'#563d7c',
    SCSS:'#c6538c', Vue:'#41b883', Svelte:'#ff3e00', MDX:'#fcb32c',
    Nix:'#7e7eff', Dockerfile:'#384d54', Makefile:'#427819', R:'#198CE7',
    Julia:'#a270ba', Scala:'#c22d40', Erlang:'#B83998', OCaml:'#3be133'
  };

  var CONFIG = {
    user: 'journey-ad',
    site: 'https://gh.ovo.re/',
    email: 'i@ovo.re',
    source: 'https://github.com/journey-ad/journey-ad.github.io',
    // return false to exclude a repo from the index
    includeRepo: function (repo) {
      return !['journey-ad.github.io', 'ovo.re'].includes(repo.name);
    }
  };

  var I18N = {
    en: {
      title: 'a demo site.',
      h1Main: 'a demo', h1Sub: 'site',
      intro: 'An index of public repositories, morning blossoms plucked at dusk.',
      colProject: 'Project', colDescription: 'Description',
      loading: 'Loading…',
      error: 'Unable to fetch the index. Try again shortly.',
      empty: 'No affiliated projects found.',
      prev: 'Prev', next: 'Next', pageOf: 'Page {n} / {total}',
      navIndex: 'Index', navLetter: 'Letter', navSource: 'Source', navStars: 'Stars',
      tagline: 'Updated via GitHub Actions',
      sourceLink: 'source',
      justNow: 'just now', minAgo: '{n}m ago', hourAgo: '{n}h ago',
      dayAgo: '{n}d ago', monthAgo: '{n}mo ago', yearAgo: '{n}y ago',
      project: 'project', projects: 'projects',
    },
    zh: {
      title: '一个 demo 站点。',
      h1Main: '一个 demo', h1Sub: '站点',
      intro: '一份公开仓库的清单，朝花夕拾。',
      colProject: '项目', colDescription: '描述',
      loading: '加载中…',
      error: '暂时无法获取索引，请稍后再试。',
      empty: '暂无关联项目。',
      prev: '上一页', next: '下一页', pageOf: '第 {n} / {total} 页',
      navIndex: '首页', navLetter: '信件', navSource: '源码', navStars: '星标',
      tagline: '通过 GitHub Actions 自动更新',
      sourceLink: '源码',
      justNow: '刚刚', minAgo: '{n} 分钟前', hourAgo: '{n} 小时前',
      dayAgo: '{n} 天前', monthAgo: '{n} 个月前', yearAgo: '{n} 年前',
      project: '个项目', projects: '个项目',
    }
  };

  function detectLang() {
    try {
      var saved = localStorage.getItem('lang');
      if (saved) return saved;
      return /^zh/i.test(navigator.language) ? 'zh' : 'en';
    } catch (_) { return 'en'; }
  }

  function isOvoHomepage(url) {
	    if (!url) return false;
	    try {
	      var hostname = new URL(url).hostname;
	      return hostname === 'ovo.re' || hostname.endsWith('.ovo.re');
	    } catch (_) { return false; }
  }

  function formatDate(dateStr) {
    var d = new Date(dateStr);
    var yyyy = d.getFullYear();
    var MM   = ('0' + (d.getMonth() + 1)).slice(-2);
    var dd   = ('0' + d.getDate()).slice(-2);
    var hh   = ('0' + d.getHours()).slice(-2);
    var mm   = ('0' + d.getMinutes()).slice(-2);
    var ss   = ('0' + d.getSeconds()).slice(-2);
    return yyyy + '-' + MM + '-' + dd + ' ' + hh + ':' + mm + ':' + ss;
  }

  var app = Vue.createApp({
    data: function () {
      return {
        allRepos: [],
        repos: [],
        loading: true,
        error: false,
        page: 1,
        perPage: 10,
        lang: detectLang(),
        CONFIG: CONFIG,
      };
    },
    computed: {
      totalPages: function () {
        return Math.ceil(this.allRepos.length / this.perPage) || 1;
      },
      countText: function () {
        var n = this.allRepos.length;
        return n + ' ' + this.t(n === 1 ? 'project' : 'projects');
      },
      pageText: function () {
        return this.t('pageOf', { n: this.page, total: this.totalPages });
      }
    },
    methods: {
      t: function (key, vars) {
        var dict = I18N[this.lang] || I18N.en;
        var str = dict[key] != null ? dict[key] : '';
        if (vars) {
          Object.keys(vars).forEach(function (k) {
            str = str.split('{' + k + '}').join(vars[k]);
          });
        }
        return str;
      },
      repoPreviewUrl: function (r) {
        return isOvoHomepage(r.homepage) ? r.homepage : (CONFIG.site + r.name);
      },
      truncateDesc: function (desc) {
        if (!desc) return '—';
        if (desc.length > 140) return desc.slice(0, 137) + '…';
        return desc;
      },
      metaParts: function (r) {
        var parts = [];
        if (r.language) {
          parts.push({ t: 'lang', color: LANG_COLORS[r.language] || '#999', name: r.language });
        }
        if (r.stargazers_count > 0) {
          parts.push({ t: 'stars', count: r.stargazers_count });
        }
        if (r.topics && r.topics.length) {
          r.topics.slice(0, 3).forEach(function (t) {
            parts.push({ t: 'tag', name: t });
          });
        }
        if (r.created_at) {
          parts.push({ t: 'time', display: this.timeAgo(r.created_at), title: formatDate(r.created_at) });
        }
        if (r.html_url) {
          parts.push({ t: 'source', url: r.html_url, label: this.t('sourceLink') });
        }
        return parts;
      },
      timeAgo: function (dateStr) {
        var diff = Date.now() - new Date(dateStr).getTime();
        var mins = Math.floor(diff / 60000);
        if (mins < 1)  return this.t('justNow');
        if (mins < 60) return this.t('minAgo', { n: mins });
        var hours = Math.floor(mins / 60);
        if (hours < 24) return this.t('hourAgo', { n: hours });
        var days = Math.floor(hours / 24);
        if (days < 30) return this.t('dayAgo', { n: days });
        var months = Math.floor(days / 30);
        if (months < 12) return this.t('monthAgo', { n: months });
        return this.t('yearAgo', { n: Math.floor(months / 12) });
      },
      toggleLang: function () {
        var next = this.lang === 'en' ? 'zh' : 'en';
        this.lang = next;
        try { localStorage.setItem('lang', next); } catch (_) {}
        document.title = this.t('title');
      },
      fetchRepos: function () {
        var self = this;
        fetch('data/repos.json')
          .then(function (r) {
            if (!r.ok) throw r.status;
            return r.json();
          })
          .then(function (repos) {
            self.allRepos = repos.filter(function (r) {
              return (r.has_pages || isOvoHomepage(r.homepage)) && CONFIG.includeRepo(r);
            });
            self.sliceRepos();
            self.loading = false;
          })
          .catch(function () {
            self.error = true;
            self.loading = false;
          });
      },
      sliceRepos: function () {
        var start = (this.page - 1) * this.perPage;
        this.repos = this.allRepos.slice(start, start + this.perPage);
      },
      scrollToCatalog: function () {
        var el = document.getElementById('catalog');
        if (el) { el.scrollIntoView({ behavior: 'smooth' }); }
      },
      goPage: function (n) {
        if (n < 1 || n > this.totalPages) return;
        this.page = n;
        this.sliceRepos();
        var self = this;
        Vue.nextTick(function () { self.scrollToCatalog(); });
      }
    },
    mounted: function () {
      document.title = this.t('title');
      this.fetchRepos();
    }
  });

  app.mount('#app');
})();
</script>
</body>
</html>
